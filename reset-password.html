<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | SafeCommunity</title>
<link rel="stylesheet" href="reset-password.css">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="auth-header"><a class="brand" href="index.html"><span class="brand-mark">S</span><span class="brand-name">Safe<span>Community</span></span></a><div class="header-account"><a href="login.html">Sign in</a></div></header>
<main class="auth-main"><section class="auth-card card"><span class="eyebrow">NEW PASSWORD</span><h1>Reset password</h1><p>Use this page when the backend provides a valid password-reset token.</p><form id="resetForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field" style="margin-top:15px"><label>New password</label><input id="password" type="password" minlength="6" required></div><div class="field" style="margin-top:15px"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="6" required></div><button class="btn btn-primary auth-submit">Update Password</button></form><p id="formStatus" class="form-status" role="status" aria-live="polite"></p></section></main>

<div id="toast" class="toast"></div>
<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
