<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign In | SafeCommunity</title>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="auth-header"><a class="brand" href="index.html"><span class="brand-mark">S</span><span class="brand-name">Safe<span>Community</span></span></a><div class="header-account">Don't have an account? <a href="register.html">Create account</a></div></header>
<main class="auth-main"><section class="auth-card card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p>Access your SafeCommunity dashboard.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field" style="margin-top:15px"><label>Password</label><input id="password" type="password" required minlength="6" placeholder="Your password"></div><div class="auth-links"><a href="forgot-password.html">Forgot password?</a><span class="small">Frontend account access</span></div><button class="btn btn-primary auth-submit" type="submit">Sign In</button></form></section></main>

<div id="toast" class="toast"></div>
<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
